# Servidor iperf3 para medir ancho de banda entre pods
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iperf3-server
  namespace: smartplant
  labels: { app: iperf3-server }
spec:
  replicas: 1
  selector:
    matchLabels: { app: iperf3-server }
  template:
    metadata:
      labels: { app: iperf3-server }
    spec:
      containers:
        - name: iperf3
          image: networkstatic/iperf3
          args: ["-s"]
          ports:
            - containerPort: 5201
---
apiVersion: v1
kind: Service
metadata:
  name: iperf3-server
  namespace: smartplant
spec:
  selector: { app: iperf3-server }
  ports:
    - port: 5201
      targetPort: 5201
