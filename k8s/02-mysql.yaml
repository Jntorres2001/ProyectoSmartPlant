apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: smartplant
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: smartplant
  labels: { app: mysql }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: mysql }
  template:
    metadata:
      labels: { app: mysql }
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: smartplant-secret, key: DB_PASSWORD }
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
          volumeMounts:
            - name: datos
              mountPath: /var/lib/mysql
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: datos
          persistentVolumeClaim: { claimName: mysql-data }
        - name: init-sql
          configMap: { name: mysql-init }   # creado desde backend/database.sql
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: smartplant
spec:
  type: ClusterIP
  selector: { app: mysql }
  ports:
    - port: 3306
      targetPort: 3306
